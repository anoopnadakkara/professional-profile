name: Build PDFs

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Install Pandoc, LaTeX, and Chromium
      run: |
        sudo apt-get update
        sudo apt-get install -y pandoc texlive-latex-base texlive-fonts-recommended texlive-extra-utils texlive-latex-extra chromium-browser libnss3 libatk1.0-0 libatk-bridge2.0-0 libcups2 libxdamage1 libxkbcommon0 libgbm1 libgtk-3-0 libxss1 libasound2t64 libpangocairo-1.0-0 libxrandr2 libxrender1

    - name: Install Node.js
      uses: actions/setup-node@v3
      with:
        node-version: '18'

    - name: Install mermaid-filter
      run: npm install -g @mermaid-js/mermaid-cli

    - name: Fix mermaid-cli index.html
      run: |
        mkdir -p $(npm root -g)/mermaid-filter/node_modules/@mermaid-js/mermaid-cli/dist
        cp $(npm root -g)/@mermaid-js/mermaid-cli/dist/index.html $(npm root -g)/mermaid-filter/node_modules/@mermaid-js/mermaid-cli/dist/index.html

    - name: Create Puppeteer config
      run: |
        printf '%s\n' '{"executablePath": "/usr/bin/chromium-browser", "args": ["--no-sandbox", "--disable-setuid-sandbox"]}' > .puppeteer.json

    - name: Process MD files
      run: python3 process_md.py

    - name: Generate PDFs
      run: |
        mkdir -p pdfs
        for file in modified/*.md; do
          base=$(basename "$file" .md)
          pandoc "$file" -o "pdfs/${base}.pdf"
        done

    - name: Upload PDFs
      uses: actions/upload-artifact@v4
      with:
        name: pdfs
        path: pdfs/