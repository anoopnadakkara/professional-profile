name: Build PDFs

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Install Pandoc, LaTeX, and Chromium
      run: |
        sudo apt-get update
        sudo apt-get install -y pandoc texlive-latex-base texlive-fonts-recommended texlive-extra-utils texlive-latex-extra librsvg2-bin chromium-browser libnss3 libatk1.0-0 libatk-bridge2.0-0 libcups2 libxdamage1 libxkbcommon0 libgbm1 libgtk-3-0 libxss1 libasound2t64 libpangocairo-1.0-0 libxrandr2 libxrender1

    - name: Install Node.js
      uses: actions/setup-node@v3
      with:
        node-version: '22'

    - name: Install Mermaid CLI
      run: npm install --no-save @mermaid-js/mermaid-cli

    - name: Create Puppeteer config
      run: |
        printf '%s\n' '{"executablePath": "/usr/bin/chromium-browser", "args": ["--no-sandbox", "--disable-setuid-sandbox"]}' > .puppeteer.json

    - name: Create Mermaid config
      run: |
        cat > .mermaid-config.json <<'EOF'
        {
          "theme": "default",
          "flowchart": {
            "htmlLabels": true
          }
        }
        EOF

    - name: Process MD files
      run: |
        export PATH="$(pwd)/node_modules/.bin:$PATH"
        python3 process_md.py

    - name: Generate PDFs
      run: |
        mkdir -p pdfs
        for file in modified/*.md; do
          base=$(basename "$file" .md)
          pandoc "$file" -o "pdfs/${base}.pdf" \
            -V geometry:margin=1in \
            -V papersize:a4paper
        done

    - name: Upload PDFs
      uses: actions/upload-artifact@v4
      with:
        name: pdfs
        path: pdfs/

    - name: Publish PDFs to branch
      run: |
        git config user.name "github-actions[bot]"
        git config user.email "github-actions[bot]@users.noreply.github.com"
        git checkout --orphan pdfs
        git rm -rf .
        find . -maxdepth 1 \! -name .git \! -name . -exec rm -rf {} +
        cp -R pdfs/* .
        git add .
        git commit -m "Update generated PDFs"
        git push --force origin pdfs
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        path: pdfs/